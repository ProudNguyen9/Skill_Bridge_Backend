name: Develop CI/CD

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: develop-ci-cd
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: proudnguyen9/skill_bridge_backend

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: SkillBridge_CI_SQL_2022_Password!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SkillBridge_CI_SQL_2022_Password!' -C -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      SKILLBRIDGE_TESTS_SQLSERVER: Server=localhost,1433;User Id=sa;Password=SkillBridge_CI_SQL_2022_Password!;Database=master;Encrypt=True;TrustServerCertificate=True
      SKILLBRIDGE_FUNCTIONAL_SQLSERVER: Server=localhost,1433;User Id=sa;Password=SkillBridge_CI_SQL_2022_Password!;Database=skillbridge;Encrypt=True;TrustServerCertificate=True
      SQLSERVER_TARGET: Server=localhost,1433;User Id=sa;Password=SkillBridge_CI_SQL_2022_Password!;Database=skillbridge;Encrypt=True;TrustServerCertificate=True

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DNTU.SkillBridge.slnx

      - name: Build
        run: dotnet build DNTU.SkillBridge.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/DNTU.SkillBridge.UnitTests --configuration Release --no-build

      - name: Prepare functional database
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet ef database update --project src/DNTU.SkillBridge.Infrastructure --startup-project src/DNTU.SkillBridge.Api --configuration Release --no-build --connection "$SQLSERVER_TARGET"

      - name: Functional tests
        run: dotnet test tests/DNTU.SkillBridge.FunctionalTests --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/DNTU.SkillBridge.IntegrationTests --configuration Release --no-build

  publish-image:
    name: Publish development image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-plesk:
    name: Publish and test deployment to Plesk
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish ASP.NET Core application
        run: >-
          dotnet publish src/DNTU.SkillBridge.Api/DNTU.SkillBridge.Api.csproj
          --configuration Release
          --output ./publish

      - name: Deploy to Plesk via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: httpdocs/
          exclude: |
            **/.env
