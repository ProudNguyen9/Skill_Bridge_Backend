name: Develop CI/CD

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: develop-ci-cd
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: proudnguyen9/skill_bridge_backend

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SKILLBRIDGE_TESTS_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DNTU.SkillBridge.slnx

      - name: Build
        run: dotnet build DNTU.SkillBridge.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/DNTU.SkillBridge.UnitTests --configuration Release --no-build

      - name: Functional tests
        run: dotnet test tests/DNTU.SkillBridge.FunctionalTests --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/DNTU.SkillBridge.IntegrationTests --configuration Release --no-build

  publish-image:
    name: Publish development image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
