services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [skillbridge]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [skillbridge]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    networks: [skillbridge]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-skillbridge};Username=${POSTGRES_USER:-skillbridge};Password=${POSTGRES_PASSWORD}
      App__FrontendBaseUrl: ${APP_FRONTEND_BASE_URL:-http://localhost:5173}
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      Jwt__Issuer: ${JWT_ISSUER:-DNTU.SkillBridge.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-DNTU.SkillBridge.Web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Cors__AllowedOrigins__0: ${APP_FRONTEND_BASE_URL:-http://localhost:5173}
      Storage__Enabled: "true"
      Storage__Provider: MinIO
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: ${MINIO_BUCKET:-skillbridge}
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Region: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [skillbridge]

networks:
  skillbridge:

volumes:
  postgres_data:
  minio_data:
