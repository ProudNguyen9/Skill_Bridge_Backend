<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bộ Sưu Tập 12 Template Email - DNTU SkillBridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">
  
  <!-- Top Navigation Header -->
  <header class="bg-[#1b365d] text-white px-6 py-3.5 flex items-center justify-between shadow-md z-10 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-[#bd1c28] flex items-center justify-center font-bold text-lg text-white">D</div>
      <div>
        <h1 class="font-bold text-base tracking-wide flex items-center gap-2">
          DNTU SkillBridge <span class="text-xs bg-[#bd1c28] text-white px-2 py-0.5 rounded-full font-semibold">12 Form Email Templates</span>
        </h1>
        <p class="text-xs text-slate-300">Chuẩn nhận diện thương hiệu Đại học Công nghệ Đồng Nai (DNTU Red &amp; Navy)</p>
      </div>
    </div>

    <!-- View Mode Toggles -->
    <div class="flex items-center space-x-2 bg-slate-800/60 p-1 rounded-lg border border-slate-700">
      <button id="btn-desktop" onclick="setViewMode('desktop')" class="px-3 py-1.5 rounded text-xs font-semibold bg-[#bd1c28] text-white transition">Desktop (682px)</button>
      <button id="btn-mobile" onclick="setViewMode('mobile')" class="px-3 py-1.5 rounded text-xs font-semibold text-slate-300 hover:text-white transition">Mobile (375px)</button>
      <a id="btn-open-tab" href="email-templates/01-otp-verification.html" target="_blank" class="px-3 py-1.5 rounded text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1">
        Mở tab riêng ↗
      </a>
    </div>
  </header>

  <!-- Main Split Layout -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar List -->
    <aside class="w-80 bg-white border-r border-slate-200 overflow-y-auto shrink-0 p-3 space-y-1.5">
      <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 py-1">Danh sách 11 mẫu email (MVP):</div>
      
        <button 
          onclick="selectTemplate('01-otp-verification', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-red-50 border-[#bd1c28] text-[#bd1c28]"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>01. Mã OTP xác thực email (F01)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Mã xác minh tài khoản DNTU SkillBridge</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Tất cả người dùng
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('02-forgot-password', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>02. Khôi phục / Đặt lại mật khẩu (F01)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Yêu cầu đặt lại mật khẩu DNTU SkillBridge</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Tất cả người dùng
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('03-new-login-alert', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>03. Cảnh báo đăng nhập thiết bị mới (F01)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Cảnh báo bảo mật: Đăng nhập từ thiết bị mới</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Tất cả người dùng
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('04-project-moderation', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>04. Kết quả duyệt bài toán (F06)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Kết quả kiểm duyệt bài toán doanh nghiệp</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Doanh nghiệp (DN)
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('05-team-invitation', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>05. Mời tham gia nhóm (F10)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Lời mời tham gia nhóm làm đồ án DNTU SkillBridge</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Sinh viên (SV)
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('06-application-result', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>06. Kết quả ứng tuyển bài toán (F09)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Kết quả ứng tuyển bài toán: Smart Logistics App</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Sinh viên / Nhóm (SV)
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('07-commitment-signing', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>07. Ký cam kết & Kích hoạt Workspace (F11, F12)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Yêu cầu ký Cam kết Dự án 3 Bên (SV - DN - GV)</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Sinh viên, Giảng viên, Doanh nghiệp
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('08-meeting-schedule', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>08. Lịch họp sprint / Cố vấn (F14)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Lịch họp Sprint / Cố vấn định kỳ</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Sinh viên, Giảng viên, Doanh nghiệp
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('09-milestone-deadline', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>09. Nhắc hạn nộp milestone (F14)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Nhắc nhở: Sắp đến hạn chót nộp Cột mốc Milestone</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Sinh viên / Nhóm (SV)
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('10-submission-review', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>10. Yêu cầu thẩm định & Sửa bài (F16, F17)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Kết quả thẩm định: Yêu cầu chỉnh sửa bài nộp (Revision)</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Sinh viên, Giảng viên, Doanh nghiệp
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('11-academic-rubric-result', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>11. Công bố điểm đồ án Rubric (F18)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Công bố điểm số & Bảng đánh giá Rubric đồ án chính thức</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Sinh viên (SV), Giảng viên, Doanh nghiệp
          </div>
        </button>
      
        <button 
          onclick="selectTemplate('12-skill-passport-verified', this)"
          class="template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700"
        >
          <div class="flex items-center justify-between text-xs font-bold mb-1">
            <span>12. Xác thực kỹ năng Skill Passport (F20)</span>
          </div>
          <div class="text-[11.5px] opacity-80 truncate text-slate-500">Chứng thực kỹ năng thực chiến vào Skill Passport cá nhân</div>
          <div class="mt-1.5 inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
            Dành cho: Sinh viên (SV)
          </div>
        </button>
      
    </aside>

    <!-- Preview Container -->
    <main class="flex-1 bg-slate-200/70 p-4 md:p-6 overflow-auto flex justify-center items-start">
      <div id="frame-container" class="w-[740px] transition-all duration-300 bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-300">
        <iframe id="preview-frame" src="email-templates/01-otp-verification.html" class="w-full h-[850px] border-0 block"></iframe>
      </div>
    </main>
  </div>

  <script>
    function selectTemplate(id, el) {
      document.getElementById('preview-frame').src = 'email-templates/' + id + '.html';
      document.getElementById('btn-open-tab').href = 'email-templates/' + id + '.html';
      
      document.querySelectorAll('.template-nav-item').forEach(b => {
        b.className = 'template-nav-item w-full text-left p-3 rounded-xl border transition bg-white border-slate-200 hover:bg-slate-50 text-slate-700';
      });
      el.className = 'template-nav-item w-full text-left p-3 rounded-xl border transition bg-red-50 border-[#bd1c28] text-[#bd1c28]';
    }

    function setViewMode(mode) {
      const container = document.getElementById('frame-container');
      const btnD = document.getElementById('btn-desktop');
      const btnM = document.getElementById('btn-mobile');

      if (mode === 'mobile') {
        container.className = 'w-[395px] transition-all duration-300 bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-slate-700';
        btnM.className = 'px-3 py-1.5 rounded text-xs font-semibold bg-[#bd1c28] text-white transition';
        btnD.className = 'px-3 py-1.5 rounded text-xs font-semibold text-slate-300 hover:text-white transition';
      } else {
        container.className = 'w-[740px] transition-all duration-300 bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-300';
        btnD.className = 'px-3 py-1.5 rounded text-xs font-semibold bg-[#bd1c28] text-white transition';
        btnM.className = 'px-3 py-1.5 rounded text-xs font-semibold text-slate-300 hover:text-white transition';
      }
    }
  </script>
</body>
</html>
